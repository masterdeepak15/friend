[project]
name = "friend-voice"
version = "0.1.0"
description = "Local speech sidecar for Friend (speech to text and text to speech)"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.1", "piper-tts>=1.3"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
